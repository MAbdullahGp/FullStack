<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Air University Result Portal - Task 4</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="lab05" class="py-5">
    <div class="container">
      <div class="profile-card mb-4">
        <h3>Task 4: Result Portal</h3>
        
        <h5 class="text-primary mt-4">Part A (Promise Chain)</h5>
        <div id="partAOutput" class="p-3 bg-light border rounded mb-4"></div>

        <h5 class="text-primary">Part B & C (Interactive Search)</h5>
        <div class="input-group mb-3" style="max-width: 400px;">
          <input type="text" id="rollInput" class="form-control" placeholder="Enter Roll No (e.g., BSCS-010)">
          <button class="btn btn-primary" id="searchBtn">Search</button>
        </div>
        <div id="searchOutput" class="mb-4" style="min-height: 80px;"></div>

        <hr class="my-4">

        <h5 class="text-primary">Part D (Load All Results & Summary)</h5>
        <button class="btn btn-success" id="loadAllBtn">Load All Results</button>
        <div id="summaryOutput"></div>
        <div id="allResultsOutput" class="mt-3"></div>
      </div>
    </div>
  </section>
  <script type="module" src="lab05.js"></script>
</body>
</html>
